name: linux

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  c:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        curl: [0, 1]
        exif: [0, 1]
        wayland: [0, 1]
        xinerama: [0, 1]

    steps:
      - uses: actions/checkout@v2
      - name: APT
        run: sudo apt-get -y update
      - name: Install Dependencies
        run: sudo apt-get -y install build-essential libx11-dev libxt-dev libimlib2-dev libtest-command-perl libtest-simple-perl
      - name: Install libcurl
        if: matrix.curl
        run: sudo apt-get -y install libcurl4-openssl-dev
      - name: Install libexif
        if: matrix.exif
        run: sudo apt-get -y install libexif-dev
      - name: Install Wayland
        if: matrix.wayland
        run: sudo apt-get -y install pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev
      - name: Install Xinerama
        if: matrix.xinerama
        run: sudo apt-get -y install libxinerama-dev
      - name: Build and Test
        run: for inotify in 0 1; do for verscmp in 0 1; do make curl=${{ matrix.curl }} exif=${{ matrix.exif }} inotify=$inotify verscmp=$verscmp wayland=${{ matrix.wayland }} xinerama=${{ matrix.xinerama }} && make test wayland=${{ matrix.wayland }} && make clean; done; done
